groups:
  - name: modaco
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 30s
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.service }} stopped answering its scrape'
          description: A process is gone or its metrics listener is not bound. Every other rule here is blind for that service until it returns.

      - alert: DeadLetterGrowing
        expr: queue_failed_jobs > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: '{{ $value }} jobs in the {{ $labels.queue }} failed set'
          description: >-
            BullMQ stops at `attempts` and leaves the job here, so nothing retries it. Clear it with
            `npm run retry-failed -- {{ $labels.queue }}` once the cause is fixed. Nothing trims this
            set, so a job that is genuinely poisoned will fail again and keep the alert firing until
            it is discarded in Bull Board at `/admin/queues` - the alert is cleared by a decision,
            not by waiting.

      - alert: QueueBacklog
        expr: queue_waiting_jobs > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.queue }} has {{ $value }} jobs waiting'
          description: A consumer is slower than its producer. Normal during a 500 000-row import, which announces about 500 batches; sustained past one is a stuck or missing worker.

      - alert: ReadModelDrifting
        expr: increase(readmodel_drift_repairs_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: The reconciler found the read model drifted and rebuilt it
          description: >-
            Redis and PostgreSQL disagreed on a category's size, which no event describes - an eviction,
            a partial restore, or a write that was lost after being consumed. The repair is
            automatic; the cause is not. `increase()` extrapolates, so its value is not a
            whole number of categories and is deliberately not quoted here; the count is on
            `readmodel_drift_repairs_total` itself.

      - alert: QueueDepthUnreadable
        expr: queue_waiting_jobs == -1 or queue_failed_jobs == -1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'the depth of {{ $labels.queue }} has not been readable for five minutes'
          description: >-
            -1 is what a depth reports when nobody could read it, which is not zero and not a
            backlog. While it stands, DeadLetterGrowing and QueueBacklog on that queue are
            silent - neither `> 0` nor `> 1000` is satisfied by -1 - so this rule is what keeps
            two dead rules from looking healthy. The reason is in the reconciler's log.

      - alert: StorefrontUnavailable
        expr: >
          sum(rate(http_request_duration_seconds_count{status_code="503"}[5m]))
          / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 2m
        labels: { severity: page }
        annotations:
          summary: '{{ $value | humanizePercentage }} of requests are answering 503'
          description: The read model cannot be reached or has not been built. A cold start clears itself once the event handler finishes rebuilding; anything longer is Redis.

      - alert: StorefrontSlow
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'p99 is {{ $value }}s'
          description: >-
            Provisional. The 300 ms comes from one machine over loopback, where a quiet
            stack answers p99 42 ms and a flash sale's recompute takes it to 104 ms.
            It is a bar to notice, not a service level, and the first run from somewhere
            that is not a laptop should replace it.
