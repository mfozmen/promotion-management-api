global:
  scrape_interval: 5s

scrape_configs:
  - job_name: promotion-management-api
    static_configs:
      - targets: ['api:3100']
        labels: { service: api }
      - targets: ['event-handler:3101']
        labels: { service: event-handler }
      - targets: ['ingestion-worker:3101']
        labels: { service: ingestion-worker }
      - targets: ['reconciler:3101']
        labels: { service: reconciler }
