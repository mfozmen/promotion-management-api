sonar.projectKey=mfozmen_promotion-management-api
sonar.organization=mfozmen
sonar.sources=src
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.coverage.exclusions=src/server.ts

# Analysis is processed asynchronously, so without this the scan step returns
# before SonarCloud has results and the issue gate that follows it queries the
# previous analysis.
sonar.qualitygate.wait=true
# Waiting is bounded so a slow SonarCloud fails the step in five minutes rather
# than holding the job until its own timeout. A timeout here is a re-run, not a
# finding.
sonar.qualitygate.timeout=300

# Ignores follow REVIEW.md 13.6.
#
# S1192 asks for a constant instead of a repeated string literal. In DDL the
# repeated literals are the "public" schema qualifier and an enum value such as
# 'ingestion': SQL has no constant to declare for either. Approved 2026-09-12.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=src/shared/db/migrations/*.sql
