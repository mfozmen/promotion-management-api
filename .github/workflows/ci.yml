name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promotion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -h 127.0.0.1 -U postgres -d promotion -c 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: No schema drift
        run: |
          npm run db:generate < /dev/null 2>&1 | tee "$RUNNER_TEMP/db-generate.log"
          grep -qE 'No schema changes|Your SQL migration file' "$RUNNER_TEMP/db-generate.log"
          git add -AN src/shared/db/migrations
          git diff --exit-code src/shared/db/migrations

      - name: Migrations are appended, never inserted
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          JOURNAL: src/shared/db/migrations/meta/_journal.json
        run: |
          git cat-file -e "$BASE^{commit}"
          git show "$BASE:$JOURNAL" > "$RUNNER_TEMP/base.json" 2>/dev/null || echo '{"entries":[]}' > "$RUNNER_TEMP/base.json"
          node -e '
            const fs = require("fs");
            const base = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/base.json", "utf8")).entries;
            const head = JSON.parse(fs.readFileSync(process.env.JOURNAL, "utf8")).entries;
            const kept = JSON.stringify(head.slice(0, base.length)) === JSON.stringify(base);
            if (!kept) throw new Error("the entries the base carries were changed; regenerate the new migration instead of reordering the journal (REVIEW.md 11.5)");
            const highest = Math.max(0, ...base.map((e) => e.when));
            for (const entry of head.slice(base.length)) {
              if (entry.when <= highest) throw new Error(`${entry.tag} carries a timestamp the base already passed; regenerate it (REVIEW.md 11.5)`);
            }
          '

      - name: Test with coverage
        run: npm run test:cov
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/promotion
          TEST_REDIS_URL: redis://127.0.0.1:6399/9

      - name: Is there anything for SonarCloud to analyse
        id: analysable
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          if grep -qE '^(src/|tests/|scripts/|package(-lock)?\.json$|.*\.config\.(ts|mjs|js)$|tsconfig.*\.json$|sonar-project\.properties$)' <<<"$files"; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "No analysable file changed; skipping the SonarCloud scan."
          fi

      - name: SonarCloud Scan
        if: steps.analysable.outputs.needed == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
