name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promotion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The schema directory and the migrations are two descriptions of one database, and
      # only the migrations are ever applied. A column added under schema/ without
      # regenerating stays invisible until a query hits a table the migrated database does
      # not have, and a regenerated 0000 silently drops the four hand-written objects
      # schema.ts names. Both show up here as a non-empty diff. Needs no database:
      # `generate` reads the schema files and the snapshots, it does not connect.
      - name: No schema drift
        run: |
          npm run db:generate
          git diff --exit-code src/shared/db/migrations

      - name: Test with coverage
        run: npm run test:cov
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/promotion

      - name: Is there anything for SonarCloud to analyse
        id: analysable
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          if grep -qE '^(src/|tests/|package(-lock)?\.json$|.*\.config\.(ts|mjs|js)$|tsconfig.*\.json$|sonar-project\.properties$)' <<<"$files"; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "No analysable file changed; skipping the SonarCloud scan."
          fi

      - name: SonarCloud Scan
        if: steps.analysable.outputs.needed == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
