name: Claude AI Review

# Advisory AI code review using anthropics/claude-code-action@v1.
#
# Auth: the Claude SUBSCRIPTION via claude_code_oauth_token — NOT an API key.
# Generate the token locally with `claude setup-token`. No Anthropic API key
# exists anywhere in this repo, so reviews draw from the subscription quota.

on:
  # Review on open/reopen/ready AND on every push (`synchronize`) so the
  # required claude-review check re-runs per push and keeps the PR mergeable.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # On-demand re-review by commenting @claude on the PR.
  issue_comment:
    types: [created]

# Cancel an in-flight review for the same PR when a newer trigger arrives.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork safety: use `pull_request` (never `pull_request_target`) and only run
    # when the PR head repo is THIS repo, so the subscription token is never
    # exposed to forked PRs. For comment-triggered runs, require an actual PR
    # comment containing @claude from a collaborator-and-above.
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository ) ||
      ( github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    # Raised with the turn limit below: a budget of 80 turns the clock cuts
    # off at 15 minutes is just the same ceiling wearing a worse failure —
    # a timeout kills the run mid-sentence, where running out of turns at
    # least ends it in order. 30 keeps the old 15/40 ratio of about 22
    # seconds a turn, so the turn budget stays the binding one.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action authenticates via OIDC and needs this.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth — do NOT add an Anthropic API key here.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # allowedTools is what lets the reviewer actually POST its findings:
          # the inline-comment tool, plus gh for reading the diff and leaving a
          # top-level summary. Without these the agent analyzes but has no
          # permitted tool to publish (silent no-op).
          #
          # TodoWrite is granted because it is the tool the agent reaches for first
          # to plan a multi-file review. Without it the run on PR #29 spent its
          # opening turns on denied calls, gave up after 9 seconds with
          # permission_denials_count 3, and posted nothing at all while still
          # reporting success — a silent no-op review is worse than a failed one.
          # Read/Grep/Glob are also granted, read-only against the checkout
          # that's already on disk (no write, no network). Without them, a
          # review that needs anything beyond the raw hunks — e.g. whether a
          # changed function has other callers, or what the surrounding file
          # looks like — has no permitted way to look, and each attempt burns
          # a denied-tool turn instead. On PR #26 the run hit
          # error_max_turns after 41 turns with 22 permission denials and
          # never posted anything, which is what the grant was meant to fix.
          # It didn't: with reading allowed, runs on #86 and #92 still ran
          # out — this time with the summary already posted and the inline
          # comments cut short. So the turns go on reading and on one call
          # per inline comment, not on denials, and the ceiling is simply
          # too low for a diff of any size. Hence 80 (issue #93).
          claude_args: |
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,TodoWrite"
          prompt: |
            You are reviewing this pull request as an ADVISORY reviewer for the
            ModaCo Promotion Management API project (Node.js, Express,
            TypeScript). Do NOT approve or block the PR — leave the verdict to
            the human and to the deterministic CI gate.

            How to publish your review, IN THIS ORDER:
            1. Fetch the diff once with `gh pr diff` (don't re-fetch it). Read
               whatever surrounding repo context you need with Read/Grep/Glob.
            2. As soon as you know your findings, use `gh pr comment` to post
               ONE concise top-level summary. ALWAYS post this summary, even
               if you find nothing notable (say so briefly).
            3. Only after the summary is posted, use
               `mcp__github_inline_comment__create_inline_comment` for inline
               comments on the specific changed lines, for the most important
               findings only.

            Post the summary BEFORE the inline comments, not after: a run
            that runs out of turns partway through inline commenting still
            leaves the summary on the PR. Posting it last (as this workflow
            used to do) means a run that dies before the end leaves nothing
            at all.

            Read REVIEW.md first: it lists the repository's review rules with
            severities, and a blocking rule violated is always a Critical
            finding, cited by rule number.

            If this PR already carries summary comments from earlier runs of
            this review, read them (`gh pr view --comments`) and review
            incrementally: verify that each earlier finding is fixed or
            answered, then review only the commits pushed since the last
            summary. Do not repeat a finding that is already resolved on a
            thread, and do not re-review unchanged lines. Say in the summary
            which commits you reviewed.

            REVIEW.md is the checklist; this prompt does not repeat it. Walk
            every section of it against the diff, and take each finding's
            severity from the section header: a rule marked blocking is a
            Critical finding, a warning rule is a Warning, cited by number.
            Apply the rules on comments (8b) and on one declaration per file
            and file names (8c) with the same weight as a bug: they are the
            owner's rules and were the ones skipped when this prompt carried
            its own list. Beyond the rulebook, look for bugs, security and
            performance problems, and for anything that weakens the two
            scalability scenarios: bulk ingestion under serverless
            timeout/memory/stateless constraints, and flash-sale read/write
            load with category-wide promotions.

            This is a case study under a deadline and the product is judged on
            working code with tests and numbers, not on prose. So report only
            what would break something or mislead someone: a REVIEW.md
            violation, a bug, a security or performance problem, a statement
            that contradicts another statement or the code, a factual error,
            or an example that does not run. Nothing else. No "consider
            rephrasing", no restating a rule the diff already follows, and no
            Suggestions at all unless the suggestion prevents a defect.

            On a diff that changes only documentation, the bar is higher still:
            two passages that disagree, a claim the code does not support, or a
            snippet with a syntax error. A document that reads awkwardly but
            says true things is finished.

            Group findings by severity (Critical / Warning / Suggestion) and
            keep every finding to at most three sentences: what breaks, what
            triggers it, what to do. Cite the rule number plus file and line
            rather than restating the rule. Skip praise, diff summaries and
            preamble. REVIEW.md states the same rule under "Be brief". Do not
            nitpick style the linter already enforces. Spend turns
            economically — you have a limited budget and the summary must go
            out well before it runs dry.
