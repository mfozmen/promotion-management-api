name: Local gates

# The local agents (e2e-tester, impact-analyzer, docs-scribe and, for design
# or scenario work, architecture-critic) run before every push (see
# CONTRIBUTING.md). Their verdicts are recorded as PR labels, and this required
# check passes only while every applicable label is present. A new push strips
# the labels so a stale verdict never covers new commits.
#
# Lives in its own workflow so label events do not re-run the full CI job.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Serialise runs per PR so a synchronize run cannot be overtaken by a labeled run.
concurrency:
  group: local-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write

jobs:
  local-gates:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # The labels must exist in the repository before they can be removed from
      # a PR: gh resolves each name against the repo's label set first. --force
      # makes this idempotent, so a fresh clone of this repo gates correctly.
      # Only the strip step needs the labels to exist, so this runs on the
      # events that precede it rather than on every label change.
      - name: Ensure the verification labels exist
        if: contains(fromJSON('["opened", "synchronize"]'), github.event.action)
        run: |
          create() { gh label create "$1" --repo "$GITHUB_REPOSITORY" --force --color "$2" --description "$3"; }
          create e2e-verified 0E8A16 "e2e-tester agent passed locally on the latest push"
          create impact-verified 0E8A16 "impact-analyzer agent passed locally on the latest push"
          create docs-verified 0E8A16 "docs-scribe agent updated the docs for the latest push"
          create architecture-verified 0E8A16 "architecture-critic agent returned SOUND on the latest push"
          create scenario 5319E7 "Implements Scenario A or B; architecture-critic required"
      # Label writes (this step and the create step above) are what fail with 403 on a fork PR, where
      # GITHUB_TOKEN is read-only regardless of the permissions block. Fork PRs cannot pass this gate;
      # open the branch in this repository instead.
      - name: Strip verification labels on new commits
        if: github.event.action == 'synchronize'
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
            --remove-label e2e-verified --remove-label impact-verified \
            --remove-label docs-verified --remove-label architecture-verified
          echo "::error::New commits pushed; re-run the local agents and re-apply their labels."
          exit 1

      - name: Require the applicable verification labels
        # gh pr view and gh pr diff --name-only are reads served by the pull-requests permission; no
        # checkout, no contents scope needed, and they succeed even with a read-only token.
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          required="e2e-verified impact-verified docs-verified"
          if grep -qE '^(ADR\.md|docs/superpowers/specs/)' <<<"$files" || grep -qx scenario <<<"$labels"; then
            required="$required architecture-verified"
          fi
          echo "required: $required"
          missing=0
          for l in $required; do
            if ! grep -qx "$l" <<<"$labels"; then
              echo "::error::missing label $l"
              missing=1
            fi
          done
          exit $missing
