name: Local gates

# The local agents (e2e-tester, impact-analyzer, docs-scribe and, for design
# or scenario work, architecture-critic) run before every push (see
# CONTRIBUTING.md). Their verdicts are recorded as PR labels, and this required
# check passes only while every applicable label is present. A new push strips
# the labels so a stale verdict never covers new commits.
#
# Lives in its own workflow so label events do not re-run the full CI job.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Serialise runs per PR so a synchronize run cannot be overtaken by a labeled run.
concurrency:
  group: local-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write

jobs:
  local-gates:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # The labels must exist in the repository before they can be removed from
      # a PR: gh resolves each name against the repo's label set first. --force
      # makes this idempotent, so a fresh clone of this repo gates correctly.
      # Only the strip step needs the labels to exist, so this runs on the
      # events that precede it rather than on every label change.
      - name: Ensure the verification labels exist
        if: contains(fromJSON('["opened", "synchronize"]'), github.event.action)
        run: |
          create() { gh label create "$1" --repo "$GITHUB_REPOSITORY" --force --color "$2" --description "$3"; }
          create e2e-verified 0E8A16 "e2e-tester agent passed locally on the latest push"
          create impact-verified 0E8A16 "impact-analyzer agent passed locally on the latest push"
          create docs-verified 0E8A16 "docs-scribe agent updated the docs for the latest push"
          create cases-verified 0E8A16 "test-case-generator wrote the story's cases for the latest push"
          create architecture-verified 0E8A16 "architecture-critic agent returned SOUND on the latest push"
          create scenario 5319E7 "Implements Scenario A or B; architecture-critic required"
      # Label writes (this step and the create step above) are what fail with 403 on a fork PR, where
      # GITHUB_TOKEN is read-only regardless of the permissions block. Fork PRs cannot pass this gate;
      # open the branch in this repository instead.
      - name: Strip verification labels on new commits
        if: github.event.action == 'synchronize'
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
            --remove-label e2e-verified,impact-verified,docs-verified,architecture-verified,cases-verified
          echo "::error::New commits pushed; re-run the local agents and re-apply their labels."
          exit 1

      - name: Require the applicable verification labels
        # Runs even after the strip step fails, so the missing-label diagnostics are always visible.
        if: ${{ !cancelled() }}
        # gh pr view and the pulls/files listing are reads served by the pull-requests permission; no
        # checkout, no contents scope needed, and they succeed even with a read-only token.
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          # Current and previous paths, so a file moved out of the specs directory still counts.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          # An agent is required by what the diff can break, not by the fact that a diff exists.
          #
          # docs-scribe always applies: any change can outdate the ADRs, the README or the
          # appendix, and the appendix is a case-study deliverable.
          #
          # e2e-tester is deliberately NOT here. Running it on every push was the single
          # biggest source of delay, and almost every run re-measured an application that had
          # not changed. It runs when the owner asks for it, and its label is applied then.
          required="docs-verified"
          # impact-analyzer covers code and the paths that decide how work is judged, because
          # a change to the judging lands on every branch in flight at once.
          judgement='^(\.github/workflows/|\.claude/agents/|\.husky/|sonar-project\.properties$)'
          behaviour='^(src/|tests/|scripts/|package(-lock)?\.json$|.*\.config\.(ts|mjs|js)$|tsconfig.*\.json$|Dockerfile|(docker-)?compose.*\.ya?ml$)'
          if grep -qE "$behaviour" <<<"$files" || grep -qE "$judgement" <<<"$files"; then
            required="$required impact-verified"
          fi
          # A pull request that adds behaviour owes the cases that decide whether the behaviour
          # is the one the story asked for. They are derived from the story, so they can fail;
          # cases derived from the code assert what was built and pass by construction.
          if grep -qE '^src/' <<<"$files"; then
            required="$required cases-verified"
          fi
          # Design documents, the modules that implement Scenario A and B, and the workers all
          # require the architecture-critic; the scenario label is the manual override.
          if grep -qE '^(ADR\.md$|docs/superpowers/specs/|src/modules/(vendor|promotion|pricing)/|src/workers/)' <<<"$files" || grep -qx scenario <<<"$labels"; then
            required="$required architecture-verified"
          fi
          echo "required: $required"
          missing=0
          for l in $required; do
            if ! grep -qx "$l" <<<"$labels"; then
              echo "::error::missing label $l"
              missing=1
            fi
          done
          exit $missing
