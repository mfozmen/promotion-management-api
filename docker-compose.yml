name: promotion-management-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ['postgres', '-c', 'log_lock_waits=on', '-c', 'deadlock_timeout=200ms']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promo}
      POSTGRES_DB: ${POSTGRES_DB:-promotion}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - promotion
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'psql --quiet --no-align --tuples-only -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - promotion
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-promo}:${POSTGRES_PASSWORD:-promo}@postgres:5432/${POSTGRES_DB:-promotion}
      REDIS_URL: redis://redis:6379
      REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-1}
      REDIS_READ_MODEL_DB: ${REDIS_READ_MODEL_DB:-0}
      SHUTDOWN_DRAIN_TIMEOUT_MS: ${SHUTDOWN_DRAIN_TIMEOUT_MS:-10000}
    ports:
      - '127.0.0.1:3100:3100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promotion
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s

  adminer:
    image: adminer:4
    profiles: [tools]
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - promotion

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: [tools]
    environment:
      REDIS_HOSTS: 'read-model:redis:6379:0,queue:redis:6379:1'
    ports:
      - '127.0.0.1:8082:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - promotion

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: postgres
      # The harness connects here to create and drop its template; without it the
      # server answers on the port and the first query fails 3D000. Applied on an
      # empty data directory only, so an existing container needs `rm -sfv`.
      POSTGRES_DB: promotion
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - promotion

  redis-test:
    image: redis:7-alpine
    profiles: [test]
    ports:
      - '127.0.0.1:6399:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - promotion

networks:
  promotion:

volumes:
  postgres-data:
  redis-data:
