name: promotion-management-api

x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-promo}:${POSTGRES_PASSWORD:-promo}@postgres:5432/${POSTGRES_DB:-promotion}
  REDIS_URL: redis://redis:6379
  REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-1}
  REDIS_READ_MODEL_DB: ${REDIS_READ_MODEL_DB:-0}
  SHUTDOWN_DRAIN_TIMEOUT_MS: ${SHUTDOWN_DRAIN_TIMEOUT_MS:-10000}
  WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-3101}

x-stores-healthy: &stores-healthy
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ['postgres', '-c', 'log_lock_waits=on', '-c', 'deadlock_timeout=200ms']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promo}
      POSTGRES_DB: ${POSTGRES_DB:-promotion}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - promotion
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'psql --quiet --no-align --tuples-only -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - promotion
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      <<: *app-environment
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-268435456}
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      <<: *stores-healthy
    networks:
      - promotion
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s

  event-handler:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    command: ['node', 'dist/workers/event-handler.js']
    environment:
      <<: *app-environment
    depends_on:
      <<: *stores-healthy
      api:
        condition: service_healthy
    networks:
      - promotion

  ingestion-worker:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    command: ['node', 'dist/workers/ingestion-worker.js']
    environment:
      <<: *app-environment
      UPLOAD_DIR: /app/uploads
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      <<: *stores-healthy
      api:
        condition: service_healthy
    networks:
      - promotion
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  reconciler:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    command: ['node', 'dist/workers/reconciler.js']
    environment:
      <<: *app-environment
    depends_on:
      <<: *stores-healthy
      api:
        condition: service_healthy
    networks:
      - promotion

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=6h'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - promotion

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: 3001
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - promotion

  adminer:
    image: adminer:4
    profiles: [tools]
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - promotion

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: [tools]
    environment:
      REDIS_HOSTS: 'read-model:redis:6379:0,queue:redis:6379:1'
    ports:
      - '127.0.0.1:8082:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - promotion

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: promotion
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'psql --quiet --no-align --tuples-only -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - promotion

  redis-test:
    image: redis:7-alpine
    profiles: [test]
    ports:
      - '127.0.0.1:6399:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - promotion

networks:
  promotion:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
