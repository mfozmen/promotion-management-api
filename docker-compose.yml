name: promotion-management-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ['postgres', '-c', 'log_lock_waits=on', '-c', 'deadlock_timeout=200ms']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promo}
      POSTGRES_DB: ${POSTGRES_DB:-promotion}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - promotion
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'psql --quiet --no-align --tuples-only -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "select 1" > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - promotion
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # One-shot: `docker compose up -d --wait` leaves the schema in place, so migrating is
  # never a step anyone has to remember. `--wait` treats a `restart: no` service that has
  # exited 0 as complete. Stopgap — once #19 builds the api image the migration moves into
  # its entrypoint (`drizzle-kit migrate && node dist/server.js`) and this service goes;
  # the two must not both run migrations.
  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Anonymous volume shadowing the bind mount. Without it `npm ci` installs into the
      # host's own node_modules and replaces the Windows esbuild binary with a Linux one,
      # which breaks the host's next `npm run dev`.
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-promo}:${POSTGRES_PASSWORD:-promo}@postgres:5432/${POSTGRES_DB:-promotion}
    depends_on:
      postgres:
        condition: service_healthy
    # npm ci inside the container rather than reusing the host install: drizzle-kit pulls
    # in esbuild, whose binary is platform-specific.
    command: ['sh', '-c', 'npm ci && npx drizzle-kit migrate']
    restart: 'no'
    networks:
      - promotion

  adminer:
    image: adminer:4
    profiles: [tools]
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - promotion

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: [tools]
    environment:
      REDIS_HOSTS: 'read-model:redis:6379:0,queue:redis:6379:1'
    ports:
      - '127.0.0.1:8082:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - promotion

networks:
  promotion:

volumes:
  postgres-data:
  redis-data:
