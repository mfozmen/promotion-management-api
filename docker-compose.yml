name: promotion-management-api

# Local infrastructure: the two stores only. Issue #19 adds the application
# services (api, event-handler, ingestion-worker with its 256 MiB / 0.5 CPU
# limits, reconciler) and the "monitoring" and "tools" profiles on top of this
# file. They slot in without a rewrite because:
#   - both stores sit on the named network `promotion` and are reachable there
#     by service name (`postgres`, `redis`);
#   - both carry a healthcheck, so an application service can wait on
#     `depends_on: { condition: service_healthy }`;
#   - every tunable lives in the .env file next to this one, so a container
#     reads the same variables a host process does. The defaults below only
#     keep `docker compose up -d --wait` working on a clean checkout, before
#     .env.example has been copied.
#
# Host processes (`npm run dev`, the tests) reach the stores on localhost
# through the published ports; containers on the `promotion` network use the
# service names. .env.example carries both forms.
#
# Redis logical databases are separated by design (REVIEW.md 5.4): database 0
# is the storefront read model, database 1 is the BullMQ queue. One server
# holds both; see REDIS_READ_MODEL_DB / REDIS_QUEUE_DB in .env.example.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promo}
      POSTGRES_DB: ${POSTGRES_DB:-promotion}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - promotion
    healthcheck:
      # The database name is needed too: pg_isready succeeds against the
      # bootstrap database while the real one is still being created.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-promo} -d ${POSTGRES_DB:-promotion}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence: the queue database holds jobs that must survive a
    # restart of this container. No `maxmemory` is set, so the default
    # `noeviction` policy holds: the read model has no TTL by design
    # (REVIEW.md 5.7) and must never be silently evicted.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - promotion
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  promotion:

volumes:
  postgres-data:
  redis-data:
